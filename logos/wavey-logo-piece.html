<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>WAVEY Graffiti Piece</title>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Inter:wght@400;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e7e1;font-family:Inter,sans-serif;color:#111}
h1{font:900 22px Inter;margin:28px 32px 4px;letter-spacing:1px}
p.sub{margin:0 32px 18px;font-size:12px;color:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 32px 32px}
.card{border-radius:6px;overflow:hidden;background:#fff}
.card svg{display:block;width:100%;height:auto}
.lbl{padding:8px 12px;font-size:11px;display:flex;justify-content:space-between;border-top:1px solid #ddd}
.lbl b{font-weight:900}
text{paint-order:stroke fill;stroke-linejoin:round}
</style></head><body>
<h1>WAVEY™ — GRAFFITI PIECE</h1>
<p class="sub">Bleu électrique / kaki · penché vers la droite · comme une pièce graffiti sur un mur</p>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8ff"/><stop offset=".45" stop-color="#1f4dff"/><stop offset="1" stop-color="#0a1cc4"/></linearGradient>
<linearGradient id="khaki" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a3a874"/><stop offset=".5" stop-color="#6b7044"/><stop offset="1" stop-color="#454a2a"/></linearGradient>
<filter id="spray" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
<filter id="wall"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0"/></filter>
<symbol id="star" viewBox="-10 -10 20 20"><path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z"/></symbol>
<clipPath id="clipT"><text x="200" y="196" text-anchor="middle" font-family="Modak" font-size="98">WAVEY</text></clipPath>

<!-- the piece, reusable: --fill / --edge / --deep via attributes on <g> -->
<g id="pieceBlue">
  <g fill="#0a0f3d" stroke="#0a0f3d" stroke-width="18" font-family="Modak" font-size="98" text-anchor="middle">
    <text x="208" y="204">WAVEY</text><text x="205" y="201">WAVEY</text><text x="202" y="198">WAVEY</text></g>
  <text x="200" y="196" text-anchor="middle" font-family="Modak" font-size="98" fill="url(#blue)" stroke="#0a0f3d" stroke-width="8">WAVEY</text>
  <g clip-path="url(#clipT)" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M30 134 H370" stroke-width="5" opacity=".9"/>
    <path d="M30 143 H370" stroke-width="2" opacity=".5"/></g>
  <g fill="#1f4dff" stroke="#0a0f3d" stroke-width="3">
    <path d="M104 200 v20 a6 6 0 1 1 -1 0 z" /><path d="M210 200 v30 a6 6 0 1 1 -1 0 z"/><path d="M286 196 v14 a5 5 0 1 1 -1 0 z"/></g>
  <text x="346" y="122" font-family="Inter" font-weight="900" font-size="15" fill="#1f4dff">TM</text>
</g>
<g id="pieceKhaki">
  <g fill="#1c1e10" stroke="#1c1e10" stroke-width="18" font-family="Modak" font-size="98" text-anchor="middle">
    <text x="208" y="204">WAVEY</text><text x="205" y="201">WAVEY</text><text x="202" y="198">WAVEY</text></g>
  <text x="200" y="196" text-anchor="middle" font-family="Modak" font-size="98" fill="url(#khaki)" stroke="#1c1e10" stroke-width="8">WAVEY</text>
  <g clip-path="url(#clipT)" fill="none" stroke="#efe9d8" stroke-linecap="round">
    <path d="M30 134 H370" stroke-width="5" opacity=".9"/>
    <path d="M30 143 H370" stroke-width="2" opacity=".5"/></g>
  <g fill="#6b7044" stroke="#1c1e10" stroke-width="3">
    <path d="M104 200 v20 a6 6 0 1 1 -1 0 z" /><path d="M210 200 v30 a6 6 0 1 1 -1 0 z"/><path d="M286 196 v14 a5 5 0 1 1 -1 0 z"/></g>
  <text x="346" y="122" font-family="Inter" font-weight="900" font-size="15" fill="#6b7044">TM</text>
</g>
</defs></svg>
<div class="grid">

<!-- A: blue on clean bg -->
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#f4f2ec"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#pieceBlue"/></g>
<g fill="#1f4dff"><use href="#star" x="40" y="214" width="22" height="22"/><use href="#star" x="340" y="40" width="18" height="18"/></g></svg>
<div class="lbl"><b>A · ELECTRIC</b><span>Bleu électrique, fond clair — recommandé</span></div></div>

<!-- B: blue on concrete wall with spray -->
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#9a968f"/><rect width="400" height="300" filter="url(#wall)"/>
<ellipse cx="200" cy="160" rx="175" ry="78" fill="#7fd1ff" filter="url(#spray)" opacity=".75"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#pieceBlue"/></g>
<g fill="#fff"><use href="#star" x="40" y="214" width="22" height="22"/><use href="#star" x="340" y="40" width="18" height="18"/></g></svg>
<div class="lbl"><b>B · WALL</b><span>Comme bombé sur un mur de béton</span></div></div>

<!-- C: khaki -->
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#efe9d8"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#pieceKhaki"/></g>
<g fill="#6b7044"><use href="#star" x="40" y="214" width="22" height="22"/><use href="#star" x="340" y="40" width="18" height="18"/></g></svg>
<div class="lbl"><b>C · KHAKI</b><span>Kaki, assorti au camo</span></div></div>

<!-- D: blue on khaki -->
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#4a4f33"/>
<ellipse cx="200" cy="160" rx="175" ry="78" fill="#1f4dff" filter="url(#spray)" opacity=".45"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#pieceBlue"/></g>
<g fill="#efe9d8"><use href="#star" x="40" y="214" width="22" height="22"/><use href="#star" x="340" y="40" width="18" height="18"/></g></svg>
<div class="lbl"><b>D · MIX</b><span>Bleu électrique sur kaki</span></div></div>

</div></body></html>
