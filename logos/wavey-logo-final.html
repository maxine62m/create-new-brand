<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>WAVEY Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Modak&family=Inter:wght@400;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e9e7e1;font-family:Inter,sans-serif;color:#111}
h1{font:900 22px Inter;margin:28px 32px 4px;letter-spacing:1px}
p.sub{margin:0 32px 18px;font-size:12px;color:#555}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 32px 32px}
.card{border-radius:6px;overflow:hidden;background:#fff}
.card svg{display:block;width:100%;height:auto}
.lbl{padding:8px 12px;font-size:11px;display:flex;justify-content:space-between;border-top:1px solid #ddd}
.lbl b{font-weight:900}
#solo{position:absolute;left:-9999px;top:0;width:1200px;background:transparent}
</style></head><body>
<h1>WAVEY™ — LOGO</h1>
<p class="sub">Bleu électrique · penché vers la droite · sans contour ni décor</p>
<svg width="0" height="0" style="position:absolute"><defs>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fa8ff"/><stop offset=".45" stop-color="#1f4dff"/><stop offset="1" stop-color="#0a1cc4"/></linearGradient>
<clipPath id="clipT"><text x="200" y="196" text-anchor="middle" font-family="Modak" font-size="98">WAVEY</text></clipPath>
<g id="logo">
  <g fill="#0b22a8" font-family="Modak" font-size="98" text-anchor="middle">
    <text x="206" y="202">WAVEY</text><text x="204" y="200">WAVEY</text><text x="202" y="198">WAVEY</text></g>
  <text x="200" y="196" text-anchor="middle" font-family="Modak" font-size="98" fill="url(#blue)">WAVEY</text>
  <g clip-path="url(#clipT)" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M30 134 H370" stroke-width="5" opacity=".85"/><path d="M30 143 H370" stroke-width="2" opacity=".45"/></g>
  <path d="M371.3 103.5 A15 15 0 1 1 362 99.2" fill="none" stroke="#1f4dff" stroke-width="2.6" stroke-linecap="round"/>
  <text x="357" y="119" text-anchor="middle" font-family="Inter" font-weight="900" font-size="11.5" fill="#1f4dff">TM</text>
</g>
</defs></svg>
<div class="grid">
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#f4f2ec"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#logo"/></g></svg>
<div class="lbl"><b>FOND CLAIR</b><span>Version principale</span></div></div>
<div class="card"><svg viewBox="0 0 400 300"><rect width="400" height="300" fill="#0d0d0d"/>
<g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#logo"/></g></svg>
<div class="lbl"><b>FOND NOIR</b><span>Sur t-shirt / hoodie noir</span></div></div>
</div>
<svg id="solo" viewBox="20 40 400 220"><g transform="rotate(6 200 150) skewX(-18) translate(50 0)"><use href="#logo"/></g></svg>
</body></html>
